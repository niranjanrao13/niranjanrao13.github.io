<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Niranjan</title>
    <meta name="description" content="An article by Niranjan, originally published on Medium." />

    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon-192.png" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/theme.css" />
    <style>
      .page {
        width: min(720px, 92vw);
        margin: 3.5rem auto 5rem;
      }

      .back-link {
        display: inline-block;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--muted);
      }

      .back-link:hover {
        color: var(--accent);
      }

      .article-header {
        margin-top: 2.5rem;
        padding-bottom: 1.75rem;
        border-bottom: 1px solid var(--line);
      }

      .article-title {
        margin: 0;
        font-size: clamp(2rem, 5vw, 2.7rem);
        line-height: 1.1;
      }

      .article-subtitle {
        margin: 1rem 0 0;
        font-size: 1.2rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .byline {
        margin-top: 1.5rem;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .prose {
        margin-top: 2.5rem;
      }

      .not-found {
        margin-top: 2.5rem;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      .tag {
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.2rem 0.65rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
      }

      .source-note {
        margin-top: 3rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--line);
        font-size: 0.95rem;
      }

      .loading {
        margin-top: 2.5rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <a class="back-link" href="../index.html#blog">&larr; Back to blog</a>

      <p class="loading" id="loading">Loading from Medium…</p>

      <p class="not-found" id="notFound" hidden>
        Couldn't load this post. It may have been moved or removed, or Medium
        may be unreachable right now.
        <a href="../index.html#blog">Return to the blog list</a>.
      </p>

      <article id="article" hidden>
        <header class="article-header">
          <h1 class="article-title" id="articleTitle"></h1>
          <p class="article-subtitle" id="articleSubtitle" hidden></p>
          <div class="byline" id="articleByline"></div>
          <div class="tags" id="articleTags"></div>
        </header>
        <div class="prose" id="articleBody"></div>
        <p class="source-note">
          Originally published on
          <a id="mediumLink" href="#" target="_blank" rel="noopener">Medium</a>.
        </p>
      </article>
    </div>

    <script src="../assets/medium.js"></script>
    <script>
      const id = new URLSearchParams(window.location.search).get("id");
      const loading = document.getElementById("loading");
      const notFound = document.getElementById("notFound");

      function fail() {
        loading.hidden = true;
        notFound.hidden = false;
      }

      if (!id) {
        fail();
      } else {
        Medium.loadPosts()
          .then((posts) => {
            const post = posts.find((p) => p.id === id);
            if (!post) return fail();

            document.title = `${post.title} | Niranjan`;
            document.getElementById("articleTitle").textContent = post.title;
            document.getElementById("articleByline").textContent =
              `Niranjan Arun Rao · ${Medium.formatDate(post.date, "long")} · ${post.readMins} min read`;

            const tags = document.getElementById("articleTags");
            post.categories.slice(0, 5).forEach((c) => {
              const el = document.createElement("span");
              el.className = "tag";
              el.textContent = c;
              tags.appendChild(el);
            });

            document.getElementById("articleBody").innerHTML =
              Medium.sanitize(post.content, post.title);
            document.getElementById("mediumLink").href = post.link;

            loading.hidden = true;
            document.getElementById("article").hidden = false;
          })
          .catch(fail);
      }
    </script>
  </body>
</html>
